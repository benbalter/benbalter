name: Lint Code Base

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history is needed for super-linter to diff changed files
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # README is partly bot-generated (post titles, list style), and
          # renovate.json follows the shared preset's formatting
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          # Stats cards are generated by update-stats.yml; light/dark pairs
          # trip jscpd and the SVG markup isn't ours to fix. Biome ignores this
          # filter (it lints the whole workspace), but with no JS here there's
          # nothing for it to lint, so it's off above.
          FILTER_REGEX_EXCLUDE: "profile/.*"
