name: Lint Code Base

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history is needed for super-linter to diff changed files
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # README is partly bot-generated (post titles, list style), and
          # renovate.json follows the shared preset's formatting
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # profile/*.svg stats cards are generated by update-stats.yml. Biome
          # and jscpd scan the whole workspace (FILTER_REGEX_EXCLUDE doesn't
          # reach them) and flag the cards' markup and light/dark pairs; with
          # no JS or real code here there's nothing else for them to check.
          VALIDATE_JSCPD: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
