name: Update profile stats cards

on:
  schedule:
    - cron: "0 6 * * 0" # Every Sunday at 06:00 UTC, after the blog-post job
  workflow_dispatch:

permissions: {}

# Shares a group with update-readme.yml so the two bots never push to master
# at the same time
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  # Third-party card code runs here with a read-only token and no persisted
  # credentials; only the commit job below can push
  generate:
    name: Generate stats cards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Old slide decks that each vendor ~5 MB of presentation-theme CSS,
      # which otherwise makes the languages card read ~85% CSS
      TOP_LANGS_EXCLUDE: project-open-data-case-study,open-sourcing-government,make-education-better-together,make-government-better-together,collaborative-policymaking,open-source-software-licensing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # core_version defaults to "v2", which makes the action npm install the
      # latest 2.x core (and unpinned transitive deps) at run time. An empty
      # value uses the core bundled via the action's lockfile instead, so the
      # SHA pin below actually pins what runs. If that ever stops working, the
      # guard step fails; fall back to an exact version like "2.2.1".
      # https://github.com/stats-organization/github-readme-stats-action/issues/114
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=benbalter&show_icons=true&hide_border=true&hide_rank=true&theme=default
          path: profile/stats-light.svg
          core_version: ""
          fail_on_error: "true"
          token: ${{ github.token }}

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=benbalter&show_icons=true&hide_border=true&hide_rank=true&theme=github_dark
          path: profile/stats-dark.svg
          core_version: ""
          fail_on_error: "true"
          token: ${{ github.token }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=benbalter&layout=compact&langs_count=8&hide_border=true&theme=default&exclude_repo=${{ env.TOP_LANGS_EXCLUDE }}
          path: profile/top-langs-light.svg
          core_version: ""
          fail_on_error: "true"
          token: ${{ github.token }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=benbalter&layout=compact&langs_count=8&hide_border=true&theme=github_dark&exclude_repo=${{ env.TOP_LANGS_EXCLUDE }}
          path: profile/top-langs-dark.svg
          core_version: ""
          fail_on_error: "true"
          token: ${{ github.token }}

      # Lifetime facts the cards don't show. Search with this token only sees
      # public activity, matching the cards
      - name: Look up profile facts
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: benbalter
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime

          user = os.environ["PROFILE_USER"]
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if os.environ.get("GH_TOKEN"):
              headers["Authorization"] = f"Bearer {os.environ['GH_TOKEN']}"

          def get(path, **params):
              url = f"https://api.github.com{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as res:
                  return json.load(res)

          def search(kind):
              result = get("/search/issues", q=f"author:{user} type:{kind}",
                           sort="created", order="asc", per_page=1)
              # A timed-out search returns partial counts; fail rather than
              # publish a wrong number
              if result["incomplete_results"] or not result["items"]:
                  raise SystemExit(f"Incomplete {kind} search results")
              return result

          def month(timestamp):
              return datetime.fromisoformat(timestamp.replace("Z", "+00:00")).strftime("%B %Y")

          def first(result):
              item = result["items"][0]
              repo = item["repository_url"].split("/repos/", 1)[1]
              return f"[{repo}#{item['number']}]({item['html_url']}), {month(item['created_at'])}"

          prs = search("pr")
          issues = search("issue")
          facts = " &middot; ".join([
              f"Member since {month(get(f'/users/{user}')['created_at'])}",
              f"First pull request: {first(prs)}",
              f"First issue: {first(issues)}",
              f"{prs['total_count']:,} pull requests",
              f"{issues['total_count']:,} issues",
          ])
          os.makedirs("profile", exist_ok=True)
          with open("profile/facts.md", "w", encoding="utf-8") as f:
              f.write(facts + "\n")
          print(facts)
          EOF

      # The action installs a runtime core into a grs-core-* temp dir; its
      # presence means the lockfile-pinned core was bypassed
      - name: Verify bundled core was used
        run: |
          if compgen -G "${TMPDIR:-/tmp}/grs-core-*" > /dev/null; then
            echo "::error::Card core was installed from npm at run time; the pinned bundle was bypassed"
            exit 1
          fi

      - name: Upload cards
        uses: actions/upload-artifact@v7
        with:
          name: stats-cards
          path: |
            profile/*.svg
            profile/facts.md
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit stats cards
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The push step uses the credentials checkout persists
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@v7

      - name: Download cards
        uses: actions/download-artifact@v8
        with:
          name: stats-cards
          path: profile

      - name: Update profile facts in README
        run: |
          python3 - <<'EOF'
          import pathlib
          import re

          readme = pathlib.Path("README.md")
          facts = pathlib.Path("profile/facts.md").read_text(encoding="utf-8").strip()
          updated, count = re.subn(
              r"(<!-- PROFILE-FACTS:START -->\n).*?(<!-- PROFILE-FACTS:END -->)",
              lambda m: m.group(1) + facts + "\n" + m.group(2),
              readme.read_text(encoding="utf-8"),
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("PROFILE-FACTS markers not found in README.md")
          readme.write_text(updated, encoding="utf-8")
          EOF

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
